name: Build, push and update deployment

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
      - "argocd/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set image tag from commit
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/rprrr736/fhir-k8s-gitops:${{ steps.vars.outputs.tag }}

      - name: Update image tag in deployment.yaml
        run: |
          sed -i "s|image: ghcr.io/rprrr736/fhir-k8s-gitops:.*|image: ghcr.io/rprrr736/fhir-k8s-gitops:${{ steps.vars.outputs.tag }}|" k8s/deployment.yaml

      - name: Commit and push the change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          if git diff --cached --quiet; then
            echo "No change to commit"
          else
            git commit -m "Deploy ${{ steps.vars.outputs.tag }}"
            git pull --rebase origin main
            git push origin main
          fi