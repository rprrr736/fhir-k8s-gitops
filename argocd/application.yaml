apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fhir-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rprrr736/fhir-k8s-gitops.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true